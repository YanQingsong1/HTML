<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Axure 项目分享中心</title>
    <link rel="stylesheet" href="theme.css">
</head>

<body class="is-locked">
    <!-- 极光背景 -->
    <div class="aurora">
        <span class="orb orb-1"></span>
        <span class="orb orb-2"></span>
        <span class="orb orb-3"></span>
    </div>

    <!-- 登录门禁 -->
    <div class="login-wrap" id="login-overlay">
        <div class="card login-card animate-in">
            <div class="login-head">
                <div class="icon-tile icon-tile-brand">🔒</div>
                <h2 class="title-m">登录验证</h2>
                <p class="caption">请输入账号密码以访问项目目录</p>
            </div>
            <form id="login-form" autocomplete="off">
                <label class="field-label">账号</label>
                <input class="field" id="login-username" type="text" placeholder="请输入账号" autocomplete="username">
                <label class="field-label" style="margin-top: 16px;">密码</label>
                <input class="field" id="login-password" type="password" placeholder="请输入密码" autocomplete="current-password">
                <label class="checkbox-row">
                    <input type="checkbox" id="login-remember">
                    <span>7 天内免登录</span>
                </label>
                <button class="btn btn-primary btn-block" type="submit">登 录</button>
                <div class="login-error" id="login-error"></div>
            </form>
        </div>
    </div>

    <button id="logout-btn" class="btn btn-secondary btn-sm logout-btn" onclick="logout()">退出登录</button>

    <main class="app">
        <header class="app-header animate-in">
            <h1 class="title-xl">📁 Axure项目分享中心</h1>
            <p class="subtitle">当前服务器地址：<span class="mono" id="server-address">—</span></p>
            <div class="search-wrap">
                <input class="field" id="search-input" type="text" placeholder="搜索项目…">
            </div>
        </header>

        <div id="loading" class="card loading-card animate-in delay-3">
            <div class="skeleton" style="width: 40%; margin: 0 auto 16px;"></div>
            <div class="skeleton" style="width: 70%; margin: 0 auto;"></div>
            <p class="caption" style="margin-top: 16px;">正在扫描项目目录…</p>
        </div>

        <div id="error-message" class="card error-card hidden"></div>
        <div id="projects-container" class="grid-cards"></div>
    </main>

    <script src="app-common.js"></script>
    <script>
        class ProjectManager {
            constructor() {
                this.serverAddress = window.location.origin;
                this.allProjects = [];
                this.init();
            }

            async init() {
                try {
                    document.getElementById('server-address').textContent = this.serverAddress;
                    this.allProjects = await this.scanProjects();
                    renderProjects(this.allProjects);
                    this.initSearch();
                } catch (error) {
                    showError(error.message || '请检查服务器状态');
                    console.error('Error:', error);
                }
            }

            initSearch() {
                const searchInput = document.getElementById('search-input');
                searchInput.addEventListener('input', (e) => {
                    const query = e.target.value.trim().toLowerCase();
                    const matched = this.allProjects.filter(project =>
                        project.name.toLowerCase().includes(query));
                    renderProjects(matched, '没有匹配的项目，换个关键词试试。');
                });
            }

            async scanProjects() {
                // python http.server 请求 / 时返回根目录 index.html 而非目录列表，
                // 因此优先读取 axureyun.bat 生成的项目清单
                try {
                    const response = await fetch(`projects.json?t=${Date.now()}`);
                    if (response.ok) {
                        const list = await response.json();
                        return list.map(item => ({
                            name: item.name,
                            subtitle: '静态原型 · index.html',
                            url: `${this.serverAddress}${item.path}index.html`
                        }));
                    }
                } catch (error) {
                    console.warn('projects.json 读取失败，回退到目录列表解析:', error);
                }

                // 回退：解析目录列表（适用于根目录无 index.html 的静态服务器）
                return await this.scanFromDirectoryListing();
            }

            async scanFromDirectoryListing() {
                const response = await fetch('/');
                const html = await response.text();
                const doc = new DOMParser().parseFromString(html, 'text/html');

                const paths = Array.from(doc.querySelectorAll('a'))
                    .map(link => link.getAttribute('href'))
                    .filter(href => href && href.endsWith('/') && !href.includes('.'))
                    .map(href => href.startsWith('/') ? href : `/${href}`);

                const results = await Promise.all(paths.map(async (path) => {
                    const res = await fetch(`${this.serverAddress}${path}index.html`);
                    if (!res.ok) return null;
                    return {
                        name: decodeURIComponent(path).replace(/\//g, ''),
                        subtitle: '静态原型 · index.html',
                        url: `${this.serverAddress}${path}index.html`
                    };
                }));
                return results.filter(Boolean);
            }
        }

        window.onload = () => requireLogin(() => new ProjectManager());
    </script>
</body>

</html>
