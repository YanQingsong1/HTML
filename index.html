<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        style-src 'self' 'unsafe-inline';
        script-src 'self' 'unsafe-inline' 'unsafe-eval';
        connect-src 'self' https://api.github.com;
    ">
    <title>Axure 项目分享中心</title>
    <link rel="stylesheet" href="theme.css">
</head>

<body class="is-locked">
    <!-- 极光背景 -->
    <div class="aurora">
        <span class="orb orb-1"></span>
        <span class="orb orb-2"></span>
        <span class="orb orb-3"></span>
    </div>

    <!-- 登录门禁 -->
    <div class="login-wrap" id="login-overlay">
        <div class="card login-card animate-in">
            <div class="login-head">
                <div class="icon-tile icon-tile-brand">🔒</div>
                <h2 class="title-m">登录验证</h2>
                <p class="caption">请输入账号密码以访问项目目录</p>
            </div>
            <form id="login-form" autocomplete="off">
                <label class="field-label">账号</label>
                <input class="field" id="login-username" type="text" placeholder="请输入账号" autocomplete="username">
                <label class="field-label" style="margin-top: 16px;">密码</label>
                <input class="field" id="login-password" type="password" placeholder="请输入密码" autocomplete="current-password">
                <label class="checkbox-row">
                    <input type="checkbox" id="login-remember">
                    <span>7 天内免登录</span>
                </label>
                <button class="btn btn-primary btn-block" type="submit">登 录</button>
                <div class="login-error" id="login-error"></div>
            </form>
        </div>
    </div>

    <button id="logout-btn" class="btn btn-secondary btn-sm logout-btn" onclick="logout()">退出登录</button>

    <main class="app">
        <header class="app-header animate-in">
            <div class="eyebrow">Axure Project Hub</div>
            <h1 class="title-xl">原型共享 · GitHub Pages</h1>
            <p class="subtitle">托管在 GitHub Pages 上的原型目录，按更新时间排序，支持搜索与一键复制。</p>
        </header>

        <section class="bento">
            <div class="card animate-in delay-1">
                <p class="caption">站点地址</p>
                <div class="hero-row" style="margin-top: 12px;">
                    <div class="hero-url mono" id="server-address">—</div>
                    <button class="btn btn-secondary btn-sm" onclick="copyServerAddress()">复制地址</button>
                </div>
                <hr class="divider">
                <input class="field" id="search-input" type="text" placeholder="搜索项目…">
            </div>

            <div class="card animate-in delay-2">
                <p class="caption">已发布项目</p>
                <div class="stat-value"><span id="stat-count">0</span> 个</div>
                <hr class="divider">
                <p class="caption" id="last-scan">最近更新：—</p>
            </div>
        </section>

        <div id="loading" class="card loading-card animate-in delay-3">
            <div class="skeleton" style="width: 40%; margin: 0 auto 16px;"></div>
            <div class="skeleton" style="width: 70%; margin: 0 auto;"></div>
            <p class="caption" style="margin-top: 16px;">正在从 GitHub 获取项目列表…</p>
        </div>

        <div id="error-message" class="card error-card hidden"></div>
        <div id="projects-container" class="grid-cards"></div>
    </main>

    <script src="app-common.js"></script>
    <script>
        const GITHUB_USER = 'YanQingsong1';
        const GITHUB_REPO = 'HTML';
        const API_URL = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents`;

        function copyServerAddress() {
            copyText(document.getElementById('server-address').textContent.trim());
        }

        class GitHubProjectManager {
            constructor() {
                this.serverAddress = `https://${GITHUB_USER}.github.io/${GITHUB_REPO}`;
                this.allProjects = [];
                this.init();
            }

            async init() {
                try {
                    document.getElementById('server-address').textContent = this.serverAddress;
                    this.allProjects = await this.scanProjects();
                    renderProjects(this.sortByUpdateTime(this.allProjects));
                    this.updateStats(this.allProjects);
                    this.initSearch();
                } catch (error) {
                    showError(error.message || '请检查网络或 GitHub 接口状态');
                    console.error('Error:', error);
                }
            }

            async scanProjects() {
                const response = await fetch(API_URL);
                if (!response.ok) {
                    throw new Error(`请求 GitHub API 失败（状态码 ${response.status}）`);
                }
                const contents = await response.json();

                const results = await Promise.all(
                    contents
                        .filter(item => item.type === 'dir' && !item.name.startsWith('.'))
                        .map(async dir => {
                            const indexUrl = `${this.serverAddress}/${encodeURIComponent(dir.name)}/index.html`;
                            try {
                                const res = await fetch(indexUrl);
                                if (!res.ok) return null;
                                const lastModified = res.headers.get('Last-Modified');
                                return {
                                    name: dir.name,
                                    subtitle: lastModified
                                        ? `更新时间：${new Date(lastModified).toLocaleString()}`
                                        : '静态原型 · index.html',
                                    date: lastModified ? new Date(lastModified) : null,
                                    url: indexUrl
                                };
                            } catch {
                                return null;
                            }
                        })
                );
                return results.filter(Boolean);
            }

            sortByUpdateTime(projects) {
                return [...projects].sort((a, b) => (b.date?.getTime() || 0) - (a.date?.getTime() || 0));
            }

            updateStats(projects) {
                setStats(projects.length);
                const latest = projects
                    .map(p => p.date)
                    .filter(Boolean)
                    .sort((a, b) => b.getTime() - a.getTime())[0];
                document.getElementById('last-scan').textContent =
                    `最近更新：${latest ? latest.toLocaleString() : '未知'}`;
            }

            initSearch() {
                const searchInput = document.getElementById('search-input');
                searchInput.addEventListener('input', (e) => {
                    const query = e.target.value.trim().toLowerCase();
                    const matched = this.allProjects
                        .filter(project => project.name.toLowerCase().includes(query));
                    this.updateStats(matched);
                    renderProjects(this.sortByUpdateTime(matched));
                });
            }
        }

        window.onload = () => requireLogin(() => new GitHubProjectManager());
    </script>
</body>

</html>
